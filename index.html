<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V0ltage's website</title>
    <style>
        body {
            background-color: rgb(20, 20, 20);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        hr {
            border: none;
            border-top: 1px solid rgb(50, 50, 50);
            margin: 20px 0;
            width: 100%;
        }

        .text-test {
            font-size: 1.2rem;
            color: rgb(200, 200, 200);
            margin: 0;
        }

        h2 {
            font-size: 1.8rem;
            margin: 0 0 20px 0;
            color: rgb(240, 240, 240);
        }

        #buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .custom-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: rgb(35, 35, 35);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid rgb(50, 50, 50);
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 1rem;
        }

        .custom-btn:hover {
            background-color: rgb(50, 50, 50);
            transform: translateY(-2px);
            border-color: rgb(80, 80, 80);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>V0ltage's website</h1>
        
        <hr>
        
        <p class="text-test">тест</p>
        
        <hr>
        
        <h2>Projects</h2>

        <div id="buttons-container"></div>
    </div>

    <script>
        const App = {
            addButton: function(text, url, imageUrl = null) {
                const container = document.getElementById('buttons-container');
                const btn = document.createElement('a');
                btn.href = url;
                btn.className = 'custom-btn';
                btn.target = '_blank';
                
                if (imageUrl) {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.className = 'btn-icon';
                    img.alt = '';
                    btn.appendChild(img);
                }
                
                const btnText = document.createTextNode(text);
                btn.appendChild(btnText);
                container.appendChild(btn);
            }
        };

        App.addButton('GitHub Профиль', 'https://github.com');
        App.addButton('Мой Репозиторий', 'https://github.com', 'https://githubassets.com');
        App.addButton('Полезный софт', '#');
    </script>
</body>
</html>
