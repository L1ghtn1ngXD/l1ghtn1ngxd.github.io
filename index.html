<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>V0ltage's resources</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: rgb(20, 20, 20);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0;
            padding: 45px 25px 60px;
        }

        .site-title {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .bio {
            max-width: 700px;
            color: rgb(170, 170, 170);
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 40px;
            text-align: left;
        }

        .resources {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .resource {
            display: block;
            width: 50%;
            background: rgb(25, 25, 25);
            border: 1px solid rgb(45, 45, 45);
            border-radius: 10px;
            overflow: hidden;
            color: white;
            text-decoration: none;
            text-align: left;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .resource:hover {
            background: rgb(30, 30, 30);
            border-color: rgb(65, 65, 65);
        }

        .resource-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .resource-content {
            padding: 16px;
            text-align: left;
        }

        .resource-title {
            margin: 0 0 7px;
            font-size: 19px;
            font-weight: 600;
        }

        .resource-description {
            margin: 0;
            color: rgb(170, 170, 170);
            line-height: 1.5;
            font-size: 14px;
        }

        footer {
            margin-top: 50px;
            color: rgb(100, 100, 100);
            font-size: 13px;
            text-align: left;
        }

        @media (max-width: 700px) {
            .page {
                padding: 30px 16px 45px;
            }

            .site-title {
                font-size: 25px;
            }

            .resource {
                width: 100%;
            }

            .resource-content {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="site-title">
            V0ltage's resources
        </div>

        <div class="bio">
            I'm V0ltage. I work on software, operating systems,
            web projects and various technical experiments.
        </div>

        <div id="resources" class="resources"></div>

        <footer>
            © V0ltage - Do not copy website without permission.
        </footer>

    </main>

    <script src="api.js"></script>

    <script>
        addResource(
            "Tech Resource Archive",
            "A collection of useful software, games, utilities and other technical resources.",
            "assets/tra.png",
            "https://l1ghtn1ngxd.github.io/tech-resource-archive"
        );
    </script>

</body>
</html>
