<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V0ltage's resources</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: rgb(20, 20, 20);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 45px 25px 60px;
        }

        .site-title {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .bio {
            max-width: 700px;
            color: rgb(170, 170, 170);
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .resources {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .resource {
            width: 100%;
            background: rgb(25, 25, 25);
            border: 1px solid rgb(45, 45, 45);
            border-radius: 12px;
            overflow: hidden;
        }

        .resource-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .resource-content {
            padding: 22px;
        }

        .resource-title {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .resource-description {
            margin: 0;
            color: rgb(170, 170, 170);
            line-height: 1.6;
            font-size: 15px;
        }

        .resource-button {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 18px;

            background: rgb(40, 40, 40);
            color: white;

            border: 1px solid rgb(55, 55, 55);
            border-radius: 8px;

            text-decoration: none;
            font-size: 14px;

            transition: background 0.15s ease,
                        border-color 0.15s ease;
        }

        .resource-button:hover {
            background: rgb(50, 50, 50);
            border-color: rgb(70, 70, 70);
        }

        footer {
            margin-top: 50px;
            color: rgb(100, 100, 100);
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .page {
                padding: 30px 16px 45px;
            }

            .site-title {
                font-size: 25px;
            }

            .resource-content {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="site-title">
            V0ltage's resources
        </div>

        <div class="bio">
            I'm V0ltage. I work on software, operating systems,
            web projects and various technical experiments.
        </div>

        <div id="resources" class="resources"></div>

        <footer>
            © V0ltage - Do not copy website without permission.
        </footer>

    </main>

    <script src="api.js"></script>

</body>
</html>
